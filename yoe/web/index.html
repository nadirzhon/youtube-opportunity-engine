<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YOE · Opportunity Engine</title>
<style>
  :root{
    --void:#05070c; --ink:#090d16; --ink2:#0f141d; --line:#1e2734;
    --txt:#e6edf3; --dim:#8b98a9; --slate:#6b768f;
    --cyan:#25e8c8; --violet:#6e5bff; --brass:#ffb13d; --red:#ff6b6b; --green:#8ce99a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:
      radial-gradient(120% 70% at 85% -10%, rgba(37,232,200,.08), transparent 60%),
      radial-gradient(120% 80% at 0% 110%, rgba(110,91,255,.10), transparent 55%),
      var(--void);
    color:var(--txt); font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh}
  a{color:inherit}
  .wrap{max-width:1280px;margin:0 auto;padding:28px 26px 60px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .mark{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--slate);
    border-radius:10px;font:800 15px ui-monospace,Menlo,monospace}
  .brand{font-weight:800;letter-spacing:.02em}
  .brand small{display:block;font:600 11px ui-monospace,monospace;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase}
  header .sub{color:var(--dim);font-size:13px}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--ink2);color:var(--txt);border-radius:10px;
    padding:9px 16px;font-size:14px;cursor:pointer;transition:.15s;display:inline-flex;gap:8px;align-items:center}
  .btn:hover{border-color:color-mix(in oklab,var(--cyan) 55%,transparent)}
  .btn.primary{background:linear-gradient(96deg,var(--cyan),var(--violet) 75%);color:#05070c;font-weight:700;border:0}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:default}
  .pill{font:600 11px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;border:1px solid currentColor}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:26px 0}
  .kpi{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .kpi .k{font:600 11px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--slate)}
  .kpi .v{font-weight:800;font-size:34px;line-height:1.1;margin-top:6px}
  .kpi .v.grad{background:linear-gradient(100deg,var(--cyan),var(--violet) 60%,var(--brass));-webkit-background-clip:text;background-clip:text;color:transparent}

  section{margin-top:30px}
  .h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
  .h h2{font-size:18px}
  .h .c{font:600 11px ui-monospace,monospace;color:var(--slate);letter-spacing:.1em}

  /* opportunity cards */
  .opp{background:var(--ink2);border:1px solid var(--line);border-left:3px solid var(--slate);
    border-radius:14px;padding:18px 20px;margin-bottom:12px}
  .opp.accelerating{border-left-color:var(--cyan)} .opp.emerging{border-left-color:var(--violet)}
  .opp.mainstream,.opp.saturated{border-left-color:var(--brass)} .opp.declining{border-left-color:var(--red)}
  .opp .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .opp h3{font-size:17px;text-transform:capitalize}
  .score{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
  .stage-cyan{color:var(--cyan)} .stage-violet{color:var(--violet)} .stage-brass{color:var(--brass)} .stage-red{color:var(--red)}
  .action{color:var(--dim);font-size:13.5px;margin-top:8px}
  .bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;margin-top:14px}
  .bar .bl{display:flex;justify-content:space-between;font:600 10.5px ui-monospace,monospace;color:var(--slate);text-transform:uppercase;letter-spacing:.04em}
  .bar .track{height:5px;background:#0a0e15;border-radius:999px;overflow:hidden;margin-top:4px}
  .bar .fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:999px;transition:width .6s ease}
  .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;color:var(--dim);font-size:12.5px}
  .against{color:#e8a08a;font-size:12.5px;margin-top:8px}
  .evi{color:var(--slate);font-size:12.5px;margin-top:6px}

  .brk{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:8px;background:var(--ink2);font-size:13.5px}
  .brk .sc{font:800 13px ui-monospace,monospace;color:var(--brass);min-width:44px}
  .muted{color:var(--slate)}

  /* build panel */
  #panel{position:fixed;inset:0;background:rgba(5,7,12,.86);backdrop-filter:blur(6px);
    display:none;place-items:center;padding:24px;z-index:20}
  #panel.on{display:grid}
  .sheet{width:min(880px,100%);max-height:88vh;overflow:auto;background:var(--ink);border:1px solid var(--line);
    border-radius:18px;padding:26px 28px}
  .sheet h2{font-size:20px}.sheet h4{color:var(--cyan);font:600 11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;margin:18px 0 8px}
  .sheet p{color:var(--dim);font-size:14px}
  .concept{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
  .concept.chosen{border-color:color-mix(in oklab,var(--cyan) 55%,transparent);background:color-mix(in oklab,var(--cyan) 6%,transparent)}
  pre{background:#0a0e15;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12.5px;white-space:pre-wrap}
  .qc{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
  .close{position:absolute;top:22px;right:26px}
  .loading{color:var(--dim);font-size:14px;padding:30px 0;text-align:center}
  canvas#stars{position:fixed;inset:0;z-index:-1;opacity:.5}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <header>
    <div class="mark">YO</div>
    <div class="brand">YOE<small>Opportunity Engine</small></div>
    <span class="sub" id="mode">·</span>
    <div class="spacer"></div>
    <button class="btn" id="rescan">↻ Rescan</button>
  </header>

  <div class="kpis" id="kpis"></div>

  <section>
    <div class="h"><h2>Live opportunities</h2><span class="c" id="oppcount"></span></div>
    <div id="opps"><div class="loading">Loading…</div></div>
  </section>

  <section>
    <div class="h"><h2>Breakout videos</h2><span class="c" id="brkcount"></span></div>
    <div id="brks"></div>
  </section>
</div>

<div id="panel"><div class="sheet" style="position:relative">
  <button class="btn close" id="pclose">✕</button>
  <div id="pbody"><div class="loading">Building…</div></div>
</div></div>

<script>
const api = (p, opt) => fetch(p, opt).then(r => r.json());
const stageColor = s => ({accelerating:'cyan',emerging:'violet',mainstream:'brass',saturated:'brass',declining:'red',latent:'slate'}[s]||'slate');
const money = n => Math.round(n).toLocaleString();

function kpi(k,v,grad){return `<div class="kpi"><div class="k">${k}</div><div class="v ${grad?'grad':''}">${v}</div></div>`}

async function load(){
  document.getElementById('opps').innerHTML = '<div class="loading">Scanning…</div>';
  const health = await api('/health');
  document.getElementById('mode').textContent = health.mode === 'youtube' ? '· live YouTube' : '· mock data';
  const scan = await api('/scan?mock=' + (health.mode!=='youtube'), {method:'POST'});
  document.getElementById('kpis').innerHTML =
    kpi('Channels', scan.channels) + kpi('Videos', scan.videos) +
    kpi('Breakouts', scan.breakouts, true) + kpi('Opportunities', scan.opportunities, true);

  const {opportunities} = await api('/opportunities?limit=50');
  document.getElementById('oppcount').textContent = opportunities.length + ' ranked';
  document.getElementById('opps').innerHTML = opportunities.map(oppCard).join('') ||
    '<p class="muted">No opportunities.</p>';

  const {breakouts} = await api('/breakouts?limit=12');
  document.getElementById('brkcount').textContent = breakouts.length;
  document.getElementById('brks').innerHTML = breakouts.map(b =>
    `<div class="brk"><span class="sc">${b.score}</span><span class="pill" style="color:var(--brass)">${b.classification.replace('_',' ')}</span>
     <span>${b.video_id}</span><span class="muted">${(b.explanation&&b.explanation[0])||''}</span></div>`).join('');
}

function oppCard(o){
  const col = stageColor(o.stage);
  const bars = Object.entries(o.breakdown).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>
    `<div class="bar"><div class="bl"><span>${k.replace(/_/g,' ')}</span><span>${v}</span></div>
     <div class="track"><div class="fill" style="width:${Math.min(100,v/18*100)}%"></div></div></div>`).join('');
  return `<div class="opp ${o.stage}">
    <div class="top">
      <span class="score">${o.score}</span>
      <h3>${o.topic.replace(/-/g,' ')}</h3>
      <span class="pill stage-${col}">${o.stage}</span>
      <span class="muted" style="font-size:12.5px">conf ${o.confidence}</span>
      <div class="spacer"></div>
      <button class="btn primary" onclick="build('${o.topic}')">⚡ Build Opportunity</button>
    </div>
    <div class="action">${o.recommended_action}</div>
    <div class="bars">${bars}</div>
    <div class="evi">${(o.evidence||[]).slice(0,2).join(' · ')}</div>
    ${(o.reasons_against&&o.reasons_against.length)?`<div class="against">⚠ ${o.reasons_against[0]}</div>`:''}
  </div>`;
}

async function build(topic){
  const panel = document.getElementById('panel'); panel.classList.add('on');
  document.getElementById('pbody').innerHTML = '<div class="loading">Building opportunity…<br><span class="muted">research → concepts → script → quality gate</span></div>';
  const p = await api('/build/'+encodeURIComponent(topic), {method:'POST'});
  const q = p.quality;
  const concepts = p.concepts.map((c,i)=>`<div class="concept ${c===undefined?'':''} ${i===0?'chosen':''}">
     <b>${(c.title_hypotheses&&c.title_hypotheses[0])||c.premise}</b> ${i===0?'<span class="pill" style="color:var(--cyan)">chosen</span>':''}
     <p style="margin-top:6px">${c.viewer_promise} — <span class="muted">${c.unique_angle}</span></p>
     <p class="muted" style="margin-top:4px">originality ${c.originality} · rank ${c.rank_score}</p></div>`).join('');
  const checks = q.checks.map(c=>`<div class="qc"><span>${c.passed?'✓':'✕'} ${c.name}</span><span class="${c.passed?'':'muted'}">${c.score}</span></div>`).join('');
  const thumbs = (p.thumbnails||[]).map((t,i)=>`<div class="concept ${i===0?'chosen':''}">
     <b>${t.direction.replace(/_/g,' ')}</b> ${i===0?'<span class="pill" style="color:var(--cyan)">pick</span>':''}
     ${t.accepted?'':'<span class="pill" style="color:var(--red)">rejected · misleading</span>'}
     <p style="margin-top:6px">overlay: <span style="color:var(--txt)">“${t.overlay_text}”</span> · <b style="color:var(--brass)">${t.overall}</b>/100</p>
     <p class="muted" style="margin-top:4px">${t.rationale}</p></div>`).join('');
  const script = `${p.script.hook}\n\n` + p.script.sections.map(s=>`— ${s.heading} [${s.retention_device}]\n  ${s.beats.join('\n  ')}`).join('\n\n') + `\n\n${p.script.outro}`;
  document.getElementById('pbody').innerHTML = `
    <h2 style="text-transform:capitalize">${p.topic.replace(/-/g,' ')}</h2>
    <p>${p.thesis.recommended_angle}</p>
    <h4>Research</h4>
    <p><b style="color:var(--txt)">Audience:</b> ${p.thesis.audience_desire}</p>
    <p><b style="color:var(--txt)">Gap:</b> ${p.thesis.content_gap}</p>
    <h4>Concepts (top ${p.concepts.length})</h4>${concepts}
    <h4>Thumbnail directions (${(p.thumbnails||[]).length})</h4>${thumbs}
    <h4>Script — ${p.script.word_count} words</h4><pre>${script.replace(/</g,'&lt;')}</pre>
    <h4>Quality gate — ${q.passed?'<span style="color:var(--green)">PASS</span>':'<span style="color:var(--red)">FAIL</span>'} · ${q.score}/100</h4>${checks}`;
}

document.getElementById('rescan').onclick = load;
document.getElementById('pclose').onclick = () => document.getElementById('panel').classList.remove('on');
document.getElementById('panel').onclick = e => { if(e.target.id==='panel') e.target.classList.remove('on'); };

// constellation backdrop
(function(){
  const cv=document.getElementById('stars'), cx=cv.getContext('2d');
  function size(){cv.width=innerWidth;cv.height=innerHeight}
  size(); addEventListener('resize',size);
  let seed=9; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
  const N=40, pts=[...Array(N)].map(()=>({x:rnd()*innerWidth,y:rnd()*innerHeight,r:1+rnd()*1.8,
    c:rnd()<.5?'37,232,200':rnd()<.5?'110,91,255':'255,177,61'}));
  cx.clearRect(0,0,cv.width,cv.height);
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
    if(d<160){cx.strokeStyle=`rgba(139,152,169,${(1-d/160)*.12})`;cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.stroke()}}
  for(const p of pts){cx.fillStyle=`rgba(${p.c},.7)`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.29);cx.fill()}
})();

load();
</script>
</body>
</html>
