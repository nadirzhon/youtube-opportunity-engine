services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      # Leave YOUTUBE_API_KEY empty to run on the built-in mock provider.
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_CHANNEL_IDS=${YOUTUBE_CHANNEL_IDS:-}
    restart: unless-stopped
  # postgres & redis are added in the persistence phase; the API runs standalone
  # on the in-memory engine for now.
